[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dorsha-consciousness-engine"
version = "0.1.0"
description = "Agent Consciousness Engine — RAG recall, error/uncertainty judgment and autonomous loop activation for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
recall = ["sentence-transformers>=2.6", "sqlite-vec>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ce = "engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
